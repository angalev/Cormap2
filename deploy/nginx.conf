# Сайт коррозионных карт для nginx (/etc/nginx/sites-available/cormap), открытый интернет.
# Метки @...@ подставляет install.sh. Каталог данных нигде не раздаётся: файлы
# карт отдаёт только Django после проверки прав.
#
# Имена сайта. Рабочие серверы отвечают только на имена из @SERVER_NAME@:
#  - задан CORMAP_DOMAIN: подставляется домен;
#  - домена нет (работа по IP): подставляются IP-адреса сервера и localhost, поэтому
#    обращение по https://IP/ работает (при заходе по IP браузер не шлёт SNI, соединение
#    принимает сервер по умолчанию с тем же сертификатом, а затем nginx выбирает
#    рабочий сервер по заголовку Host).
# Всё остальное (чужой Host, сканеры) попадает на сервер по умолчанию и получает 444.
# certbot.sh меняет только строки с пометкой «# cormap-name».

# Частота запросов с одного адреса. Строгая зона - вход на сайт и смена пароля (подбор
# пароля), мягкая - всё остальное (опрос состояния карты, скачивание файлов).
limit_req_zone $binary_remote_addr zone=cormap_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cormap_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cormap_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream cormap_app {
    server unix:/run/cormap/gunicorn.sock fail_timeout=0;
}

# --- порт 80: сервер по умолчанию (незнакомый Host) ------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # проверка домена при выпуске сертификата (certbot.sh): запрос может прийти
    # с именем, которого ещё нет в списке рабочих серверов
    location ^~ /.well-known/acme-challenge/ {
        root @ACME_DIR@;
    }

    location / {
        return 444;
    }
}

# --- порт 80: рабочий сервер, только перенаправление на https -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@; # cormap-name
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root @ACME_DIR@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- порт 443: сервер по умолчанию (незнакомый Host) ------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # сертификат нужен для рукопожатия (ssl_reject_handshake закрыл бы и заход по IP)
    include @TLS_DIR@/ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# --- порт 443: сайт -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @SERVER_NAME@; # cormap-name
    server_tokens off;

    # ssl_certificate и ssl_certificate_key; файл переписывает certbot.sh
    include @TLS_DIR@/ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cormap_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # предел книги 50 МБ + 2 МБ на поля формы (web/config/settings.py)
    client_max_body_size 52m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # не более 20 одновременных соединений с одного адреса; общий предел частоты
    limit_conn cormap_conn 20;
    limit_req zone=cormap_general burst=60 nodelay;

    # Заголовки безопасности (HSTS, nosniff, X-Frame-Options, Referrer-Policy,
    # Cross-Origin-Opener-Policy, Content-Security-Policy) ставит Django; здесь не
    # дублируются.
    proxy_set_header Host $host;
    # именно $remote_addr, а не $proxy_add_x_forwarded_for: сайт берёт последнее
    # значение заголовка (web/maps/audit.py), присланное клиентом значение отбрасывается
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    # статику отдаёт nginx, поэтому nosniff для неё ставится здесь
    location /static/ {
        alias @STATIC_DIR@/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # вход: строгий предел (10 запросов в минуту, запас 5)
    location = /login/ {
        limit_req zone=cormap_login burst=5 nodelay;
        proxy_pass http://cormap_app;
    }
    # смена пароля: тот же предел (подбор текущего пароля из чужого сеанса)
    location = /password/ {
        limit_req zone=cormap_login burst=5 nodelay;
        proxy_pass http://cormap_app;
    }

    # админка из интернета закрыта: она открывается только с самого сервера (ниже)
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://cormap_app;
    }
}

# --- порт 8443, только localhost: тот же сайт с админкой --------------------------------
# Порт слушает только сам сервер и в межсетевом экране не открыт. Администратор
# пробрасывает его через SSH:  ssh -L 8443:127.0.0.1:8443 <учётная запись>@<сервер>
# и открывает https://localhost:8443/admin/ . Сертификат выпущен на имя сайта, поэтому
# браузер предупредит о несовпадении имени: соединение идёт внутри SSH, это ожидаемо.
server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost 127.0.0.1;
    server_tokens off;

    include @TLS_DIR@/ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 52m;

    # $http_host, а не $host: с номером порта, иначе Django не сверит Origin формы
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location /static/ {
        alias @STATIC_DIR@/;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /login/ {
        limit_req zone=cormap_login burst=5 nodelay;
        proxy_pass http://cormap_app;
    }

    location / {
        proxy_pass http://cormap_app;
    }
}
