{# Подсказка «обработчик не запущен»: показывается сразу или включается из poll.js #}
<div class="alert error" id="stall-hint"{% if not job.stalled %} hidden{% endif %}>
  <p><strong>Обработка не начинается дольше обычного.</strong> Похоже, обработчик заданий не запущен.
  Обратитесь к администратору: после запуска обработчика страница обновится сама.</p>
</div>
