# Размеры и точки привязки значков (ТЗ, раздел 7).
#
# width_mm, height_mm - размер значка на бумаге в миллиметрах; не зависит от
#   масштаба листа. Совпадают с размером viewBox одноимённого SVG.
# anchor = [ax, ay] - точка привязки в долях размера значка от левого верхнего
#   угла (y растёт вниз): [0.5, 1.0] - низ-центр (значок стоит над трубой),
#   [0.5, 0.5] - центр (на трубе / пересечение), [0.5, 0.0] - верх-центр
#   (значок висит под трубой). Привязка ставится на ось трубы в точке дистанции.
# Для типов «поперёк трубы» и «участок под трубой» значок нужен прежде всего
# для листа условных обозначений; геометрию на схеме рисует отрисовщик листа 2.
# min_width_mm - необязательный ключ для типов с полосой под трубой: наименьшая
#   ширина протяжённого объекта на бумаге, мм (ТЗ, 7.1). Если ключа нет, действует
#   общий минимум min_extended_width_mm из layout.toml. У болота, леса и шурфа/поворота
#   (рисуются целыми значками) минимум равен ширине одного значка.
# Размеры подобраны по образцу листа 2 при печати A4 альбомный (297 мм).

[kip]  # Контрольно-измерительный пункт, above
width_mm = 4.0
height_mm = 12.0
anchor = [0.5, 1.0]

