# Геометрия листа, ряд длин и параметры размещения (ТЗ, разделы 5-6).
# Файл общий для этапов 5 (разбиение), 6 (PDF/PNG) и 7 (Excel). Все размеры - мм
# бумаги, длины листов - км трассы. Читается cormap/layout_settings.py со строгой
# проверкой: лишний или пропущенный ключ - ошибка.

# --- бумага (альбомная ориентация) ---
[paper.A4]
width_mm = 297.0
height_mm = 210.0

[paper.A3]
width_mm = 420.0
height_mm = 297.0

# --- поля и колонки листа ---
# Ширина оси X участка = ширина бумаги - 2 * margin_mm - label_column_mm
#   - plot_pad_left_mm - plot_pad_right_mm (для A4: 297 - 20 - 35 - 12 - 6 = 224 мм).
[page]
margin_mm = 10.0          # поля листа со всех сторон
label_column_mm = 35.0    # левая колонка с названием полосы
plot_pad_left_mm = 12.0   # отступ области графика слева (подписи оси Y)
plot_pad_right_mm = 6.0   # отступ области графика справа

# --- ряд длин листа и шаг делений оси (ТЗ, раздел 6) ---
# Списки одной длины: i-й шаг относится к i-й длине.
[sheet]
lengths_km    = [0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0]
tick_steps_km = [0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]

# --- автоматический режим ---
[auto]
max_length_km = 100.0   # наибольшая длина листа (должна быть в ряду)
min_length_km = 0.5     # наименьшая длина листа (должна быть в ряду)
tiers = 2               # число ярусов значков над трубой
max_sections = 300      # предел числа участков (600 листов)

# --- подписи и значки ---
[labels]
font_pt = 7.0                  # кегль подписи значка
gap_mm = 0.5                   # зазор между значками и подписями
callout_levels = 3             # число уровней выноски подписи (0, 1, 2)
callout_step_mm = 3.0          # подъём подписи на один уровень выноски
min_extended_width_mm = 1.5    # наименьшая ширина протяжённого объекта на бумаге (участки под трубой)
min_cross_band_width_mm = 3.5  # наименьшая ширина полосы поперёк трубы (дорога) на бумаге
# Семейства шрифта подписей по порядку предпочтения (берётся первое найденное).
font_families = ["Times New Roman", "Liberation Serif", "DejaVu Serif"]
