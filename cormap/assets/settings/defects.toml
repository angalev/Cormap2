# Критерии повреждений изоляционного покрытия (ИП). ТЗ, раздел 5.3.
#
# Критерии заказчик пока не передал. Расчёт ВЫКЛЮЧЕН: площадь дефекта строится
# по ручным данным книги (блок «Повреждения» и пометки «ПИП»). Придумывать
# значения нельзя. Когда заказчик передаст критерии, их вносят сюда (код не
# правится) и ставят enabled = true.

# Включён ли расчёт. При true все обязательные параметры ниже должны быть
# заполнены, иначе программа остановится с перечнем недостающего.
enabled = false

# Источник повреждений: "manual" - ручные данные книги, "calc" - расчёт,
# "both" - оба вместе. При enabled = false всегда используются только ручные.
source = "manual"

# Как объединить класс по силе и класс по протяжённости:
# "max" (по умолчанию) - больший, "min" - меньший,
# "strength" - только по силе, "length" - только по протяжённости.
final_class = "max"

[signal]
# Колонки сигнала (все из одного блока: либо градиенты, либо потенциалы):
# grad_left_on, grad_left_off, grad_right_on, grad_right_off, u_on, u_off.
# columns = ["grad_left_on", "grad_right_on"]   # ПРИМЕР, не критерий заказчика
# Сочетание колонок: "max_abs" - наибольший модуль, "sum_abs" - сумма модулей,
# "single" - одна колонка (модуль её значения).
combine = "max_abs"

[norm]
# Граница нормы: "constant" - значение сигнала, "ratio" - кратность к фону.
# Вне нормы - строго больше границы.
# mode = "ratio"    # ПРИМЕР, не критерий заказчика
# value = 2.0       # ПРИМЕР, не критерий заказчика

[background]
# Фон нужен при norm.mode = "ratio".
# method = "median"          # медиана по всей трассе
#                            # "rolling_median" - скользящая медиана (нужен window_m)
#                            # "constant" - заданное значение (нужен value)
# window_m = 500.0           # ПРИМЕР, не критерий заказчика
# value = 1.0                # ПРИМЕР, не критерий заказчика

[merge]
# max_gap_m = 10.0      # ПРИМЕР, не критерий заказчика: наибольший разрыв склейки, м
# min_length_m = 2.0    # ПРИМЕР, не критерий заказчика: наименьшая протяжённость, м

[class_strength]
# Нижние границы классов по силе (в единицах сигнала при constant, в кратностях
# при ratio): класс 3 - от class_3 и выше, класс 2 - от class_2 до class_3,
# класс 1 - всё остальное вне нормы.
# class_1 = 1.0     # ПРИМЕР, не критерий заказчика
# class_2 = 2.0     # ПРИМЕР, не критерий заказчика
# class_3 = 4.0     # ПРИМЕР, не критерий заказчика

[class_length]
# Нижние границы классов по протяжённости, м. Можно не задавать совсем -
# тогда класс по протяжённости не применяется.
# class_1 = 0.0     # ПРИМЕР, не критерий заказчика
# class_2 = 10.0    # ПРИМЕР, не критерий заказчика
# class_3 = 50.0    # ПРИМЕР, не критерий заказчика
