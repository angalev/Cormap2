# Параметры отрисовки листов PDF и PNG (ТЗ, разделы 5 и 8; этап 6).
# Геометрия листа (поля, колонка названия, отступы графика) - в layout.toml, здесь
# только то, что относится к рисованию. Размеры - мм бумаги, кегли и толщины линий -
# пункты, цвета - в формате matplotlib. Читается cormap/render_settings.py со строгой
# проверкой: лишний или пропущенный ключ - ошибка.

[sizes]  # кегли, пт
title_pt = 12.0        # заголовок листа 1
strip_label_pt = 9.0   # название полосы в левой колонке
tick_pt = 7.0          # подписи делений осей
caption_pt = 7.0       # «Протяженность, км»
legend_pt = 7.0        # легенды и подписи под графиками
no_data_pt = 9.0       # «нет данных»
footer_pt = 6.0        # колонтитул

[geometry]  # мм
title_height_mm = 10.0     # строка заголовка листа 1
footer_mm = 5.0            # место под колонтитул внизу (внутри полей листа)
axes_top_pad_mm = 2.5      # отступ области графика от верха полосы
tick_row_mm = 4.0          # строка подписей делений под осью
legend_box_mm = 5.0        # высота рамки легенды
legend_pad_mm = 1.0        # зазор между подписями делений и рамкой легенды, и до низа полосы
legend_line_mm = 8.0       # длина образца линии в легенде
legend_gap_mm = 3.5        # промежуток между элементами легенды
top_axis_header_mm = 9.0   # полосы с осью сверху: строка «Протяженность, км» и строка делений
ribbon_pad_mm = 2.0        # отступ ленты/графика от нижнего края полосы с осью сверху
objects_pad_mm = 1.0       # запас над и под зоной значков в полосе «Объекты на трассе»
caption_right_mm = 30.0    # место справа под «Протяженность, км»

[sheet1]  # доли высоты полос листа 1 (без заголовка и колонтитула), сумма = 1
potential = 0.23
gradient_left = 0.23
gradient_right = 0.23
defects = 0.155
zones = 0.155

[sheet2]  # доли высоты четырёх полос листа 2 без «Объекты на трассе» (её высота по значкам)
insulation = 0.17
depth = 0.31
resistivity = 0.31
soil = 0.21

[axes]
potential_top = -3.0      # верх оси потенциала (ось перевёрнута)
potential_bottom = -0.5
potential_step = 0.5
gradient_top = 90.0
gradient_step = 10.0
defects_top = 3.0
depth_step = 0.1
max_ticks = 10            # больше делений по вертикали не рисуем: шаг увеличивается (0,10 -> 0,20 -> 0,50 -> 1,0)

[tiles]
tile_mm = 8.0             # сторона плитки текстуры на бумаге, не зависит от масштаба листа
texture_dpi = 250.0       # разрешение, в которое сжимается плитка

[lines]  # толщины, пт
frame = 0.9
cell = 0.6
axis = 0.5
grid = 0.5
potential = 1.6
norm = 1.8
gradient = 0.5
depth = 1.2
depth_norm = 1.8
resistivity = 0.9
defects = 1.5
zones = 3.0
pipe = 3.0
cross = 0.7
leader = 0.4
water_shore = 1.6      # берега водной преграды
water_wave = 0.6       # волны внутри широкой воды
open_frame = 1.4       # пунктирная рамка открытого участка
open_hatch = 0.9       # косая штриховка открытого участка
air_ground = 0.9       # линия провала земли под воздушным переходом
air_post = 1.4         # стойка опоры воздушного перехода

[extended]  # протяжённые объекты под трубой (ТЗ, 7.1); размеры - мм бумаги, если не сказано иное
wave_amp_ratio = 0.12          # размах волны берега: доля ширины полосы ...
wave_amp_min_mm = 0.15         # ... но не меньше этого
wave_amp_max_mm = 0.6          # ... и не больше этого
wave_periods = 2.5             # сколько периодов волны по высоте полосы
water_wave_step_mm = 6.0       # одна волна внутри воды на каждые столько мм ширины
water_wave_alpha = 0.55        # прозрачность волн внутри воды
open_dash_on_pt = 4.2          # штрих рамки открытого участка, пт
open_dash_off_pt = 2.8         # промежуток рамки, пт
open_hatch_pitch_mm = 2.2      # шаг косой штриховки по горизонтали
open_hatch_run_mm = 4.0        # горизонтальный вынос штриха (наклон)
air_depth_ratio = 0.55         # глубина провала земли: доля высоты полосы
air_post_half_ratio = 0.08     # полуширина основания опоры: доля ширины полосы ...
air_post_half_min_mm = 0.35    # ... но не меньше этого
air_post_half_max_mm = 0.9     # ... и не больше этого
air_post_top_mm = 1.2          # стойка опоры начинается на столько выше низа полосы
air_post_foot_height_mm = 1.6  # высота треугольного основания опоры
air_post_foot_lift_mm = 0.2    # основание приподнято над низом полосы

[colors]
frame = "#000000"
axis = "#7f7f7f"
grid = "#808080"
u_on = "#00b050"
u_off = "#00b0f0"
u_max = "#1f3f7f"
u_min = "#ff0000"
gradient_left_on = "#4f81bd"
gradient_left_off = "#c0504d"
gradient_right_on = "#4f81bd"
gradient_right_off = "#9bbb59"
defects = "#c00000"
defects_fill = "#f4b6b0"
depth = "#1f77b4"
depth_norm = "#ff0000"
resistivity = "#000000"
res_high = "#ff0000"
res_mid = "#ffff00"
res_low = "#99ff33"
pipe = "#333333"
pipe_light = "#8c8c8c"
sky_top = "#cfe6f5"
sky_bottom = "#ffffff"
ground_top = "#ffffff"
ground_bottom = "#7fc241"
road = "#808080"
road_mark = "#ffffff"
cross = "#000000"
leader = "#404040"
water_shore = "#00b0f0"   # цвет линии значка «водная преграда»
water_fill = "#bfe8fb"    # заливка воды между берегами
open_frame = "#8b5a2b"    # цвет рамки и штриховки значка «открытый участок»
open_fill = "#f4e3c8"     # заливка открытого участка (из значка)
air_ground = "#8b5a2b"    # линия провала земли под воздушным переходом
air_post = "#404040"      # цвет опор значка «воздушный переход»
air_void = "#ffffff"      # заливка провала между опорами
